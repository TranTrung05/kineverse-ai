[package]
name = "rust-kineverse"
version = "0.1.0"
edition = "2021"
description = "High-performance gesture recognition and spatial math core for Kineverse AI"

[lib]
name = "kineverse_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
